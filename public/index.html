<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShare Pro — Smart Campus Academic Resource Platform</title>
  <meta name="description" content="A centralized academic resource sharing and collaboration platform for college students and faculty. Share notes, PYQs, assignments, and earn achievement points.">
  <meta name="theme-color" content="#4f46e5">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- App Root Mount Container -->
  <div id="app"></div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Dynamic Modal Backdrop & Dialog Container -->
  <div id="modalContainer" class="modal-container hidden" role="dialog" aria-modal="true"></div>

  <!-- Application Scripts -->
  <script src="app.js"></script>
</body>
</html>
